<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>新标签页</title>
  <meta name="version" content="0.9.0">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='30' cy='34' r='22' fill='%23f7d54d'/%3E%3Cpath d='M34 12c8-9 18-6 20-5-1 9-9 15-20 5z' fill='%2358a36c'/%3E%3C/svg%3E">

  <!-- 首屏兜底色；外部引导脚本会在样式加载前写入主题。 -->
  <style>
    html, body { background-color: #1a1a2e !important; }
    html[data-theme="light"], html[data-theme="light"] body { background-color: #f0f0f5 !important; }
  </style>
  <script src="bootstrap.js"></script>

  <!-- 默认背景始终来自本地，无远程预连接。 -->
  <link rel="preload" as="image" href="pumpkin-8384698_960_720.jpg">
  <link rel="stylesheet" href="index.css">
</head>
<body>
  <video id="background-video" class="background-video" autoplay muted loop playsinline preload="metadata" aria-hidden="true" tabindex="-1"></video>
  <main class="page">
    <h1 id="clock">00:00</h1>
    <p id="date-label">月日星期日</p>

    <div class="search-panel">
      <div class="search-box">
        <button type="button" class="search-icon" id="search-icon-btn" aria-label="选择搜索引擎" aria-controls="search-dropdown" aria-expanded="false">
          <svg class="search-icon-svg" width="18" height="18" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" aria-hidden="true" focusable="false">
            <path d="M21 21l-4.35-4.35" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
            <circle cx="11" cy="11" r="6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
          </svg>
        </button>
        <input class="search-input" id="search-input" autocomplete="off" spellcheck="false" type="text" aria-label="搜索">
        <div class="search-dropdown" id="search-dropdown" role="menu" aria-label="搜索引擎"></div>
      </div>
    </div>

  </main>

  <!-- 设置按钮：右下角，hover 热区显示 -->
  <div class="settings-trigger-wrap">
    <button type="button" id="settings-trigger" class="settings-trigger" aria-label="打开设置" title="设置">
      <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="settings-trigger-icon">
        <path stroke-linecap="round" stroke-linejoin="round" d="M10.343 3.94c.09-.542.56-.94 1.11-.94h1.093c.55 0 1.02.398 1.11.94l.149.894c.07.424.384.764.78.93.398.164.855.142 1.205-.108l.737-.527a1.125 1.125 0 0 1 1.45.12l.773.774c.39.389.44 1.002.12 1.45l-.527.737c-.25.35-.272.806-.107 1.204.165.397.505.71.93.78l.893.15c.543.09.94.559.94 1.109v1.094c0 .55-.397 1.02-.94 1.11l-.894.149c-.424.07-.764.383-.929.78-.165.398-.143.854.107 1.204l.527.738c.32.447.269 1.06-.12 1.45l-.774.773a1.125 1.125 0 0 1-1.449.12l-.738-.527c-.35-.25-.806-.272-1.203-.107-.398.165-.71.505-.781.929l-.149.894c-.09.542-.56.94-1.11.94h-1.094c-.55 0-1.019-.398-1.11-.94l-.148-.894c-.071-.424-.384-.764-.781-.93-.398-.164-.854-.142-1.204.108l-.738.527c-.447.32-1.06.269-1.45-.12l-.773-.774a1.125 1.125 0 0 1-.12-1.45l.527-.737c.25-.35.272-.806.108-1.204-.165-.397-.506-.71-.93-.78l-.894-.15c-.542-.09-.94-.56-.94-1.109v-1.094c0-.55.398-1.02.94-1.11l.894-.149c.424-.07.765-.383.93-.78.165-.398.143-.854-.108-1.204l-.526-.738a1.125 1.125 0 0 1 .12-1.45l.773-.773a1.125 1.125 0 0 1 1.45-.12l.737.527c.35.25.807.272 1.204.107.397-.165.71-.505.78-.929l.15-.894Z" />
        <path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 1 1-6 0 3 3 0 0 1 6 0Z" />
      </svg>
    </button>
  </div>

  <!-- 设置面板：右侧滑出 -->
  <aside id="settings-panel" class="settings-panel" role="dialog" aria-modal="true" aria-label="设置" aria-hidden="true" inert>
    <div class="settings-panel-header">
      <span class="settings-panel-title">设置</span>
      <button type="button" id="settings-close" class="settings-panel-close" aria-label="关闭设置" title="关闭">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
      </button>
    </div>
    <div class="settings-panel-inner" id="settings-panel-inner">
      <!-- 设置项容器：后续扩展用 -->
      <div class="settings-items" id="settings-items"></div>
    </div>
  </aside>

  <script src="index.js"></script>
</body>
</html>
